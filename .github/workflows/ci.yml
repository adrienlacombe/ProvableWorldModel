# SPDX-License-Identifier: Apache-2.0
#
# Merge-gate pipeline (docs/spec/07-testing-strategy.md#ci-gates, RFC-0013).
# Every job below must pass for a PR to merge (INV-TEST-16). The pipeline is
# pinned to the project toolchain (the nightly in rust-toolchain.toml) for
# determinism (INV-TEST-17): the vendored proving substrate requires nightly
# (RFC-0015 toolchain decision). Perf-budget (#75) and golden-parity (export
# harness) gates are wired by their own issues.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref to keep the queue short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned project toolchain (must match rust-toolchain.toml).
  TOOLCHAIN: "nightly-2025-07-14"

jobs:
  format:
    name: Format (cargo fmt --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2025-07-14"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint (clippy -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2025-07-14"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2025-07-14"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  no-std:
    name: no_std verifier build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2025-07-14"
      - uses: Swatinem/rust-cache@v2
      # Canonical gate (docs/spec/07-testing-strategy.md#ci-gates): the verifier
      # chain compiles with no default features, mirroring Stwo's own
      # `ensure-verifier-no_std` pattern. The vendored Stwo (RFC-0015) has a
      # non-optional std-only dependency (dashmap), so a fully bare-metal target
      # build is not supported by the substrate; `--no-default-features` is the
      # no_std contract the spec defines and the verifier chain keeps.
      - run: cargo build -p pwm-verifier --no-default-features --locked
      - run: cargo build -p pwm-core --no-default-features --locked

  docs:
    name: Doc build + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2025-07-14"
      - uses: Swatinem/rust-cache@v2
      # rustdoc for the public API; -D warnings fails on broken intra-doc links.
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      # Internal cross-reference check across the docs corpus (file + anchor).
      - name: Internal link check (docs/)
        run: python3 ci/check-links.py

  license:
    name: License / SPDX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX header check
        run: bash ci/check-spdx.sh
      - name: cargo-deny (licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  mutation:
    name: Constraint mutation (scoped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2025-07-14"
      - uses: Swatinem/rust-cache@v2
      # Skeleton scope: the runner evaluates every registered campaign (only the
      # empty campaign exists yet) and exits non-zero on a survivor or a score
      # below target (INV-TEST-05). Components register real campaigns as they land.
      - run: cargo run -p pwm-testkit --bin mutation_runner --locked
