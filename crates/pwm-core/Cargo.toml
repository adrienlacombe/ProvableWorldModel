# SPDX-License-Identifier: Apache-2.0
[package]
name = "pwm-core"
description = "Field/fixed-point types, tensors, manifest types, canonical serialization, and Fiat-Shamir transcript shared across ProvableWorldModel. no_std-clean and free of proving dependencies (INV-ARCH-01)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Vendored Stwo, field types only (RFC-0002 re-export). The workspace pins
# default-features = false, so this is no_std and pulls in no prover/FRI/PCS/
# channel code: the one permitted substrate edge for pwm-core (INV-ARCH-01).
stwo = { workspace = true }
# Blake2s for the public-input digest, commitments, and transcript (RFC-0014).
blake2 = { workspace = true }

[dev-dependencies]
# Test-only: validates that the hand-rolled value-free JSON emitter produces
# well-formed JSON and round-trips. Never a runtime dependency of pwm-core, so
# the no_std / dependency-free trust-root guarantee is unaffected.
serde_json = { workspace = true }

[lints]
workspace = true
