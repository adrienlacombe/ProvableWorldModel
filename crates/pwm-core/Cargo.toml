# SPDX-License-Identifier: Apache-2.0
[package]
name = "pwm-core"
description = "Field/fixed-point types, tensors, manifest types, canonical serialization, and Fiat-Shamir transcript shared across ProvableWorldModel. no_std-clean and free of proving dependencies (INV-ARCH-01)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["proof-system", "world-model", "commit-and-audit", "no-std", "cryptography"]
categories = ["cryptography", "no-std", "mathematics"]

[features]
# `obs` gates the observability *schema* (the LogRecord / MetricSample types and
# the value-free JSON emitter, #67): data-only types with no live producer yet.
# It is **off by default**, so nothing that links pwm-core normally — above all the
# no_std verifier trust root — carries it. CI exercises `tests/obs.rs` via
# `cargo test --all-features`.
obs = []

[dependencies]
# Blake2s for the public-input digest, commitments, and Fiat-Shamir transcript
# (specs.md §4, §6). The only crypto dependency; no_std, no proving substrate
# (INV-ARCH-01). The field types (M31, audit field Fp61) are native to this crate.
blake2 = { workspace = true }

[dev-dependencies]
# Test-only: validates that the hand-rolled value-free JSON emitter produces
# well-formed JSON and round-trips. Never a runtime dependency of pwm-core, so
# the no_std / dependency-free trust-root guarantee is unaffected.
serde_json = { workspace = true }

[lints]
workspace = true
