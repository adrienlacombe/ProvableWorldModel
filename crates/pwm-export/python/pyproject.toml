# SPDX-License-Identifier: Apache-2.0
# Build/lint config for the export subpackage: the Python side of the le-wm
# checkpoint -> quantized integer graph pipeline. Pinned, ruff-linted, and
# mypy-typed to match the Cargo.lock discipline on the Rust side.
[project]
name = "pwm-export"
version = "0.1.0"
description = "Export the le-wm V0 checkpoint into the ProvableWorldModel prover (quantize, fold BatchNorm, write the committed manifest and prover bundles)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "pillow>=10.0",
    "pyarrow>=14.0",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
