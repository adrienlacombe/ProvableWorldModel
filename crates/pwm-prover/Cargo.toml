# SPDX-License-Identifier: Apache-2.0
[package]
name = "pwm-prover"
description = "Prover CLI and orchestration: load manifest, run reference inference, build traces, drive the Stwo commit/challenge/proof flow, and emit the ProofArtifact bundle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pwm-core = { workspace = true }
pwm-air = { workspace = true }
pwm-circuits = { workspace = true }
pwm-export = { workspace = true }
# Vendored Stwo prover (RFC-0015), referenced by path only. The prover drives the
# Stwo commit/challenge/proof flow, so it opts into the `prover` feature (which
# enables std); the workspace default is no_std for the verifier path.
stwo = { workspace = true, features = ["prover"] }

[lints]
workspace = true
