#
# Pinned build toolchain for reproducible builds. Post-pivot the project uses the
# CommitLLM commit-and-audit backend, which has no nightly-only dependency (the
# vendored Stwo prover that required nightly was removed). The workspace builds on
# stable Rust; pin a stable channel and bump only on a MINOR+ release with a
# `Changed` changelog entry. See specs.md (toolchain).
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
